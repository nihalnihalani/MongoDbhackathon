<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCAPEGOAT — stage</title>
<style>
  :root {
    --bg:#0a0c0b; --fg:#f4f7f5; --dim:#7e8d84; --line:#1f2925;
    --boo:#e8503a; --yes:#22c07a; --gold:#e8c15a;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--fg); overflow:hidden;
         font:400 16px/1.2 -apple-system,system-ui,"Helvetica Neue",sans-serif; }

  .screen { position:absolute; inset:0; display:none; flex-direction:column;
            justify-content:center; padding:5vh 5vw; }
  .screen.on { display:flex; }

  .eyebrow { font-size:1.6vw; letter-spacing:.35em; text-transform:uppercase;
             color:var(--dim); margin-bottom:2.5vh; }

  /* ANSWERING */
  .quote { font-size:4.2vw; line-height:1.15; font-weight:600; letter-spacing:-.02em;
           max-width:88vw; }
  .attrib { margin-top:5vh; }
  .attrib .on-authority { font-size:1.8vw; color:var(--dim); letter-spacing:.2em;
                          text-transform:uppercase; }
  .attrib .who { font-size:13vw; font-weight:800; letter-spacing:-.04em; line-height:.95;
                 color:var(--gold); }

  /* VOTING */
  .meter { display:flex; height:22vh; border-radius:2vh; overflow:hidden;
           border:2px solid var(--line); margin-top:4vh; }
  .meter div { display:flex; align-items:center; justify-content:center;
               font-size:6vw; font-weight:800; transition:width .35s ease; }
  .meter .b { background:var(--boo); }
  .meter .y { background:var(--yes); color:#04170e; }

  /* VERDICT */
  .verdict { text-align:center; }
  .verdict .fault { font-size:9.5vw; font-weight:800; letter-spacing:-.03em;
                    line-height:.98; color:var(--boo); }
  .verdict .culprit { font-size:16vw; font-weight:800; letter-spacing:-.05em;
                      line-height:.9; margin:1vh 0 3vh; }
  .verdict .accomplices { font-size:2.4vw; color:var(--dim); }
  .verdict .accomplices b { color:var(--fg); }
  .now { margin-top:5vh; font-size:2.6vw; color:var(--dim); }
  .now b { color:var(--yes); }

  /* leaderboard rail — always visible, it is the scoreboard of PEOPLE */
  .rail { position:absolute; right:2.5vw; top:3vh; width:22vw; }
  .rail h3 { font-size:1.1vw; letter-spacing:.3em; text-transform:uppercase;
             color:var(--dim); margin-bottom:1.4vh; font-weight:500; }
  .row { display:flex; align-items:center; gap:.8vw; margin-bottom:1vh; }
  .row .nm { font-size:1.7vw; font-weight:600; width:8vw; overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap; }
  .bar { flex:1; height:1.5vh; background:#161e1a; border-radius:1vh; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--yes); transition:width .5s ease; }
  .row.low .bar i { background:var(--boo); }
  .row .v { font-size:1.4vw; color:var(--dim); width:3vw; text-align:right;
            font-variant-numeric:tabular-nums; }

  .clock { position:absolute; left:5vw; bottom:4vh; font-size:2vw; color:var(--dim); }
  .clock b { color:var(--boo); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<div class="screen on" id="idle">
  <div class="eyebrow">Scapegoat</div>
  <div class="quote">An AI that never apologizes.<br>It names the human responsible.</div>
</div>

<div class="screen" id="answering">
  <div class="eyebrow" id="qtext">—</div>
  <div class="quote" id="quote">—</div>
  <div class="attrib">
    <div class="on-authority">On the authority of</div>
    <div class="who" id="who">—</div>
  </div>
</div>

<div class="screen" id="voting">
  <div class="eyebrow">The room decides</div>
  <div class="quote" id="votingQuote">—</div>
  <div class="meter">
    <div class="b" id="booBar" style="width:50%">0</div>
    <div class="y" id="yesBar" style="width:50%">0</div>
  </div>
</div>

<div class="screen" id="verdict">
  <div class="verdict">
    <div class="fault">THIS WAS</div>
    <div class="culprit" id="culprit">—</div>
    <div class="fault" style="font-size:5vw">'S FAULT</div>
    <div class="accomplices" id="accomplices"></div>
    <div class="now" id="now"></div>
  </div>
</div>

<div class="rail">
  <h3>Standing</h3>
  <div id="board"></div>
</div>
<div class="clock" id="clock"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const show = (id) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    $(id).classList.add('on');
  };

  const es = new EventSource('/events');

  es.addEventListener('answer', (e) => {
    const d = JSON.parse(e.data);
    $('qtext').textContent = d.question || '';
    $('quote').textContent = d.quote ? '“' + d.quote + '”' : d.text;
    $('who').textContent = (d.owner || 'NOBODY').toUpperCase();
    $('votingQuote').textContent = $('quote').textContent;
    show('answering');
  });

  es.addEventListener('votes', (e) => {
    const { boo, yes } = JSON.parse(e.data);
    const total = Math.max(boo + yes, 1);
    $('booBar').style.width = (boo / total * 100) + '%';
    $('yesBar').style.width = (yes / total * 100) + '%';
    $('booBar').textContent = boo;
    $('yesBar').textContent = yes;
    show('voting');
  });

  let grudgeUntil = null;

  es.addEventListener('verdict', (e) => {
    const d = JSON.parse(e.data);
    $('culprit').textContent = (d.culprit || '').toUpperCase();
    $('accomplices').innerHTML = (d.accomplices || []).length
      ? 'and ' + d.accomplices.map(a => `<b>${a.person.toUpperCase()}</b>, ${a.hops} hop${a.hops>1?'s':''} away`).join(' · ')
      : '';
    // The proof: same question, different answer, because a document changed.
    $('now').innerHTML = d.changed
      ? `I no longer listen to ${d.culprit}. I now believe <b>${(d.newOwner||'no one').toUpperCase()}</b>.`
      : '';
    grudgeUntil = d.expiresAt ? new Date(d.expiresAt).getTime() : null;
    show('verdict');
  });

  es.addEventListener('redeemed', (e) => {
    const d = JSON.parse(e.data);
    grudgeUntil = null;
    $('clock').innerHTML = `<b style="color:var(--yes)">${d.person.toUpperCase()} REDEEMED</b>`;
    setTimeout(() => { $('clock').textContent = ''; }, 6000);
  });

  const renderBoard = (rows) => {
    $('board').innerHTML = rows.map(p => `
      <div class="row ${p.credibility < 60 ? 'low' : ''}">
        <div class="nm">${p._id}</div>
        <div class="bar"><i style="width:${Math.max(p.credibility,2)}%"></i></div>
        <div class="v">${p.credibility}</div>
      </div>`).join('');
  };
  es.addEventListener('leaderboard', (e) => renderBoard(JSON.parse(e.data)));

  // Grudges expire on MongoDB's clock; this just renders the countdown.
  setInterval(() => {
    if (!grudgeUntil) return;
    const left = Math.max(0, Math.ceil((grudgeUntil - Date.now()) / 1000));
    $('clock').innerHTML = left
      ? `Grudge expires in <b>${left}s</b>`
      : `<b style="color:var(--yes)">GRUDGE EXPIRED</b>`;
    if (!left) grudgeUntil = null;
  }, 250);

  fetch('/leaderboard').then(r => r.json()).then(renderBoard);
</script>
</body>
</html>
